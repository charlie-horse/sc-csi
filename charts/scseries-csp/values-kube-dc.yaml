# kube-dc platform profile. Combine with a site file holding array.host, array.tls.fingerprint and credentials:
#   helm upgrade --install scseries-csp charts/scseries-csp -n hpe-storage --create-namespace \
#     -f charts/scseries-csp/values-kube-dc.yaml -f my-site.yaml
csp:
  volumeFolder: kube-dc
  serverFolder: kube-dc

storageClasses:
  - name: scseries-block
    isDefault: false
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    fsType: xfs
    # kube-dc storage-class contract: without the tier label a csi.hpe.com class is offered as
    # RWO filesystem only, so VMs on it could not live-migrate.
    labels:
      storage.kube-dc.com/tier: balanced
      storage.kube-dc.com/kind: block
    annotations:
      storage.kube-dc.com/display-name: "SC Series (Fibre Channel)"
      storage.kube-dc.com/capabilities: "snapshot,clone,expand,block-mode,rwx-block,live-migration"
      storage.kube-dc.com/snapshot-class: scseries-snap
    parameters:
      description: "kube-dc PVC {pvc} in {namespace}"
    allowedTopologies:
      - matchLabelExpressions:
          - {key: csi.hpe.com/zone, values: [sc]}

cdi:
  storageProfiles:
    enabled: true          # KubeVirt VMs on these classes get RWX raw block DataVolumes (live-migratable)

serviceMonitor:
  enabled: true
prometheusRule:
  enabled: true
audit:
  enabled: true
