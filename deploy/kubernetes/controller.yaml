# The controller: creates, deletes, snapshots, expands and maps volumes on
# the array. One replica; the sidecars use leader election so a rolling
# update never runs two active controllers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sc-csi-controller
  namespace: sc-csi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sc-csi
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sc-csi
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: sc-csi-controller
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sc-csi
          image: cr.neuros.is/sc-csi
          args:
            - controller
            - --endpoint=unix:///csi/csi.sock
            - --metrics-listen=:9090
          env:
            - name: SC_HOST_FILE
              value: /etc/sc-csi/array/host
            - name: SC_USER_FILE
              value: /etc/sc-csi/array/username
            - name: SC_PASSWORD_FILE
              value: /etc/sc-csi/array/password
            - name: SC_TLS_FINGERPRINT_FILE
              value: /etc/sc-csi/array/fingerprint
          ports:
            - name: metrics
              containerPort: 9090
            - name: healthz
              containerPort: 9808
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: array
              mountPath: /etc/sc-csi/array
              readOnly: true
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.1
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --timeout=120s
            - --default-fstype=ext4
          securityContext: *restricted
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.13.1
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --timeout=120s
          securityContext: *restricted
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.7.1
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --timeout=120s
          securityContext: *restricted
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.3.1
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --timeout=120s
          securityContext: *restricted
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.1
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9808
          securityContext: *restricted
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: array
          secret:
            secretName: sc-csi-array
            defaultMode: 0440
