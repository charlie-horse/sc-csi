# The node plugin: attaches FC LUNs, then formats and mounts them for pods.
# It runs privileged with the host's /dev, /sys and kubelet directory. The
# host root is mounted at HOST_ROOT; multipath, multipathd and dmsetup run
# there through chroot, with HOST_PATH (the NixOS system PATH) searched.
# hostNetwork reaches multipathd's socket; hostIPC lets device-mapper and
# udev sync with the host. Health ports are host ports on every node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sc-csi-node
  namespace: sc-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sc-csi
      app.kubernetes.io/component: node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sc-csi
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: sc-csi-node
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: sc-csi
          image: cr.neuros.is/sc-csi
          args:
            - node
            - --endpoint=unix:///csi/csi.sock
            - --node-name=$(NODE_NAME)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_ROOT
              value: /host
            - name: HOST_PATH
              value: /run/current-system/sw/bin
          ports:
            - name: healthz
              containerPort: 9818
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: udev
              mountPath: /run/udev
            - name: host-root
              mountPath: /host
              mountPropagation: HostToContainer
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.1
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/sc.csi.neuros.is/csi.sock
            - --http-endpoint=:9819
          ports:
            - name: registrar
              containerPort: 9819
          livenessProbe:
            httpGet:
              path: /healthz
              port: registrar
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.20.1
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9818
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/sc.csi.neuros.is
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: udev
          hostPath:
            path: /run/udev
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
