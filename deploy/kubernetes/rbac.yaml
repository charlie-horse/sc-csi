# RBAC for the controller sidecars. The ClusterRole and Role rules are
# copied from each sidecar's deploy/kubernetes RBAC file at the release tag
# the controller uses (kubernetes-csi, Apache-2.0); all are bound to the one
# controller ServiceAccount. The node plugin uses no Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sc-csi-controller
  namespace: sc-csi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sc-csi-node
  namespace: sc-csi
automountServiceAccountToken: false
---
# From kubernetes-csi/external-provisioner.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-external-provisioner-runner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
---
# From kubernetes-csi/external-provisioner.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-provisioner-role
subjects:
  - kind: ServiceAccount
    name: sc-csi-controller
    namespace: sc-csi
roleRef:
  kind: ClusterRole
  name: sc-csi-external-provisioner-runner
  apiGroup: rbac.authorization.k8s.io
---
# From kubernetes-csi/external-provisioner.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: sc-csi
  name: sc-csi-external-provisioner-cfg
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "watch", "list", "delete", "update", "create"]
- apiGroups: ["storage.k8s.io"]
  resources: ["csistoragecapacities"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get"]
---
# From kubernetes-csi/external-provisioner.
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-provisioner-role-cfg
  namespace: sc-csi
subjects:
  - kind: ServiceAccount
    name: sc-csi-controller
    namespace: sc-csi
roleRef:
  kind: Role
  name: sc-csi-external-provisioner-cfg
  apiGroup: rbac.authorization.k8s.io
---
# From kubernetes-csi/external-attacher.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-external-attacher-runner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
---
# From kubernetes-csi/external-attacher.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-attacher-role
subjects:
  - kind: ServiceAccount
    name: sc-csi-controller
    namespace: sc-csi
roleRef:
  kind: ClusterRole
  name: sc-csi-external-attacher-runner
  apiGroup: rbac.authorization.k8s.io
---
# From kubernetes-csi/external-attacher.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: sc-csi
  name: sc-csi-external-attacher-cfg
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "watch", "list", "delete", "update", "create"]
---
# From kubernetes-csi/external-attacher.
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-attacher-role-cfg
  namespace: sc-csi
subjects:
  - kind: ServiceAccount
    name: sc-csi-controller
    namespace: sc-csi
roleRef:
  kind: Role
  name: sc-csi-external-attacher-cfg
  apiGroup: rbac.authorization.k8s.io
---
# From kubernetes-csi/external-snapshotter.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-external-snapshotter-runner
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotcontents/status"]
    verbs: ["update", "patch"]
---
# From kubernetes-csi/external-snapshotter.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-snapshotter-role
subjects:
  - kind: ServiceAccount
    name: sc-csi-controller
    namespace: sc-csi
roleRef:
  kind: ClusterRole
  name: sc-csi-external-snapshotter-runner
  apiGroup: rbac.authorization.k8s.io
---
# From kubernetes-csi/external-snapshotter.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: sc-csi
  name: sc-csi-external-snapshotter-leaderelection
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "watch", "list", "delete", "update", "create"]
---
# From kubernetes-csi/external-snapshotter.
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-external-snapshotter-leaderelection
  namespace: sc-csi
subjects:
  - kind: ServiceAccount
    name: sc-csi-controller
    namespace: sc-csi
roleRef:
  kind: Role
  name: sc-csi-external-snapshotter-leaderelection
  apiGroup: rbac.authorization.k8s.io
---
# From kubernetes-csi/external-resizer.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-external-resizer-runner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
---
# From kubernetes-csi/external-resizer.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-resizer-role
subjects:
  - kind: ServiceAccount
    name: sc-csi-controller
    namespace: sc-csi
roleRef:
  kind: ClusterRole
  name: sc-csi-external-resizer-runner
  apiGroup: rbac.authorization.k8s.io
---
# From kubernetes-csi/external-resizer.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: sc-csi
  name: sc-csi-external-resizer-cfg
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "watch", "list", "delete", "update", "create"]
---
# From kubernetes-csi/external-resizer.
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sc-csi-resizer-role-cfg
  namespace: sc-csi
subjects:
  - kind: ServiceAccount
    name: sc-csi-controller
    namespace: sc-csi
roleRef:
  kind: Role
  name: sc-csi-external-resizer-cfg
  apiGroup: rbac.authorization.k8s.io
